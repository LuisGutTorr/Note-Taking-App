<script>
  // Apply the saved theme before first paint to avoid a flash.
  (function () {
    var mode = 'auto';
    try { mode = localStorage.getItem('notes.theme') || 'auto'; } catch (e) {}
    var dark = mode === 'dark' || (mode === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
/* ============ Design tokens — tweak the palette here ============ */
:root {
  --bg1: #8da2c4;            /* dusty slate blue */
  --bg2: #a8b6e2;            /* soft periwinkle */
  --bg3: #d3e5f4;            /* pale sky */
  --glow: rgba(255,255,255,.38);
  --ink: #10203f;
  --ink-2: #40537b;
  --ink-3: #596b92;
  --card: rgba(255,255,255,.66);
  --card-hover: rgba(255,255,255,.82);
  --card-solid: #fbfcff;
  --card-border: rgba(255,255,255,.85);
  --sheet: rgba(255,255,255,.94);
  --accent: #13264f;         /* deep navy */
  --on-accent: #ffffff;
  --accent-soft: rgba(19,38,79,.08);
  --line: rgba(16,32,63,.13);
  --shadow: 0 12px 34px rgba(36,56,108,.15);
  --shadow-lg: 0 30px 80px rgba(30,48,100,.25);
  --danger: #a8211a;
  --note-bg: #e4eeff;  --note-ink: #1d3a7a;
  --tip-bg: #dcf3e8;   --tip-ink: #11593a;
  --warn-bg: #fff0d1;  --warn-ink: #7a4a05;
  --code-bg: #0f1b38;
  --radius: 26px;
  --font-body: 'Figtree', system-ui, sans-serif;
  --font-display: 'Outfit', 'Figtree', system-ui, sans-serif;
  --font-dot: 'Doto', 'Outfit', monospace;
}
[data-theme="dark"] {
  --bg1: #0a1230;
  --bg2: #1a2064;
  --bg3: #0e2a55;
  --glow: rgba(120,140,255,.22);
  --ink: #e4ecff;
  --ink-2: #b2bfe4;
  --ink-3: #93a2cc;
  --card: rgba(22,33,78,.58);
  --card-hover: rgba(30,44,98,.72);
  --card-solid: #131d47;
  --card-border: rgba(160,180,255,.16);
  --sheet: rgba(13,21,54,.92);
  --accent: #d6e2ff;
  --on-accent: #0d1a3f;
  --accent-soft: rgba(214,226,255,.1);
  --line: rgba(190,205,255,.16);
  --shadow: 0 12px 34px rgba(0,0,10,.35);
  --shadow-lg: 0 30px 80px rgba(0,0,10,.5);
  --danger: #ff9b94;
  --note-bg: #1d2f66;  --note-ink: #c4d6ff;
  --tip-bg: #14403a;   --tip-ink: #b6f0d6;
  --warn-bg: #4a3512;  --warn-ink: #ffdca0;
}

/* ============ Highlight meanings ============ */
:root {
  --hl-important: rgba(255,196,0,.5);  --hl-important-dot: #f2b200;
  --hl-remember: rgba(80,150,255,.3);  --hl-remember-dot: #3d82f0;
  --hl-question: rgba(176,100,255,.28); --hl-question-dot: #a35cf0;
}
[data-theme="dark"] {
  --hl-important: rgba(255,196,0,.3);  --hl-important-dot: #ffd04a;
  --hl-remember: rgba(90,160,255,.36); --hl-remember-dot: #7db3ff;
  --hl-question: rgba(190,120,255,.38); --hl-question-dot: #c796ff;
}
mark.hl { color: inherit; padding: 1px 3px; margin: 0 -1px; border-radius: 6px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.hl-important { background: var(--hl-important); }
mark.hl-remember { background: var(--hl-remember); }
mark.hl-question { background: var(--hl-question); }
.hl-dot { display: block; width: 16px; height: 16px; border-radius: 50%; border: 2px solid transparent; }
.hl-dot-important { background: var(--hl-important-dot); } .hl-dot-remember { background: var(--hl-remember-dot); } .hl-dot-question { background: var(--hl-question-dot); }
.ce-inline-tool--active .hl-dot { border-color: var(--ink); }

/* ============ Folder tones (note sheet background) ============ */
:root {
  --tone-sky: rgba(226,238,255,.96); --tone-mint: rgba(222,243,234,.96); --tone-sage: rgba(230,239,220,.96);
  --tone-sand: rgba(246,236,217,.96); --tone-rose: rgba(249,227,230,.96); --tone-lilac: rgba(235,228,248,.96);
  --tone-slate: rgba(228,232,240,.96);
}
[data-theme="dark"] {
  --tone-sky: rgba(23,42,92,.94); --tone-mint: rgba(17,56,47,.94); --tone-sage: rgba(35,51,31,.94);
  --tone-sand: rgba(58,47,26,.94); --tone-rose: rgba(61,31,44,.94); --tone-lilac: rgba(45,34,96,.94);
  --tone-slate: rgba(31,38,56,.94);
}
.sheet[data-tone="sky"] { --sheet: var(--tone-sky); } .sheet[data-tone="mint"] { --sheet: var(--tone-mint); }
.sheet[data-tone="sage"] { --sheet: var(--tone-sage); } .sheet[data-tone="sand"] { --sheet: var(--tone-sand); }
.sheet[data-tone="rose"] { --sheet: var(--tone-rose); } .sheet[data-tone="lilac"] { --sheet: var(--tone-lilac); }
.sheet[data-tone="slate"] { --sheet: var(--tone-slate); }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.sw { width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--tone, var(--card-solid)); display: grid; place-items: center; color: var(--ink); transition: transform .12s; }
.sw:hover { transform: scale(1.08); }
.sw[aria-checked="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.sw[data-tone=""] { background: var(--card-solid); }
.sw[data-tone="sky"] { --tone: var(--tone-sky); } .sw[data-tone="mint"] { --tone: var(--tone-mint); } .sw[data-tone="sage"] { --tone: var(--tone-sage); }
.sw[data-tone="sand"] { --tone: var(--tone-sand); } .sw[data-tone="rose"] { --tone: var(--tone-rose); } .sw[data-tone="lilac"] { --tone: var(--tone-lilac); }
.sw[data-tone="slate"] { --tone: var(--tone-slate); }
.fdot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--tone); border: 1px solid var(--line); }
.fdot[data-tone="sky"] { --tone: var(--tone-sky); } .fdot[data-tone="mint"] { --tone: var(--tone-mint); } .fdot[data-tone="sage"] { --tone: var(--tone-sage); }
.fdot[data-tone="sand"] { --tone: var(--tone-sand); } .fdot[data-tone="rose"] { --tone: var(--tone-rose); } .fdot[data-tone="lilac"] { --tone: var(--tone-lilac); }
.fdot[data-tone="slate"] { --tone: var(--tone-slate); }

/* ============ Base ============ */
*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: light; }
html[data-theme="dark"] { color-scheme: dark; }
body {
  margin: 0; min-height: 100vh;
  font-family: var(--font-body); font-size: 16px; line-height: 1.5; color: var(--ink);
  background: linear-gradient(155deg, var(--bg1) 0%, var(--bg2) 52%, var(--bg3) 100%) fixed;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(50% 40% at 85% 8%, var(--glow), transparent 70%),
    radial-gradient(45% 45% at 5% 95%, var(--glow), transparent 70%);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }
svg { display: block; flex: none; }
::selection { background: rgba(110,140,230,.35); }

.app { position: relative; z-index: 1; display: flex; align-items: flex-start; min-height: 100vh; }
main { flex: 1; min-width: 0; padding: 40px clamp(20px, 4vw, 56px) 150px; }

/* ============ Sidebar ============ */
.sidebar {
  position: sticky; top: 16px; margin: 16px 0 16px 16px; width: 64px; flex: none;
  max-height: calc(100vh - 32px); overflow: hidden auto; scrollbar-width: thin;
  padding: 10px 8px; border-radius: 28px;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow);
  backdrop-filter: blur(22px) saturate(1.3); -webkit-backdrop-filter: blur(22px) saturate(1.3);
  transition: width .25s ease;
}
.sidebar.open { width: 268px; }
.sb-item, .sec-head {
  display: flex; align-items: center; gap: 12px; width: 100%; height: 44px; padding: 0 13px;
  border-radius: 16px; color: var(--ink-2); text-align: left; white-space: nowrap;
}
.sb-item:hover, .sec-head:hover, .frow:hover { background: var(--accent-soft); color: var(--ink); }
.sb-item.active { background: var(--accent); color: var(--on-accent); }
.sb-item .grow, .sec-head .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.sb-count, .fcount { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.sb-item.active .sb-count { color: inherit; opacity: .8; }
.sidebar:not(.open) .grow, .sidebar:not(.open) .sb-count, .sidebar:not(.open) .sec-add,
.sidebar:not(.open) .sec-list { display: none; }
.sec-head { height: 40px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink-3); }
.sec-add { margin-left: auto; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; color: var(--ink-2); }
.sec-add:hover { background: var(--accent-soft); }
.sec-list { padding-bottom: 4px; }
.frow {
  display: flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 6px 0 calc(8px + var(--d, 0) * 16px);
  border-radius: 12px; color: var(--ink-2); cursor: pointer; font-size: 14.5px;
}
.frow.active { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.frow.drop { outline: 2px dashed var(--accent); }
.frow .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; transition: transform .15s; }
.chev.o { transform: rotate(90deg); }
.chev-sp { width: 22px; flex: none; }
.fact { display: none; gap: 0; }
.frow:hover .fact { display: flex; }
.frow:hover .fcount { display: none; }
.fact button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: var(--ink-2); }
.fact button:hover { background: var(--accent-soft); color: var(--ink); }
.empty-hint { padding: 4px 14px 8px; font-size: 13px; color: var(--ink-3); white-space: normal; }

/* ============ Floating action bar ============ */
.dock {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20;
  display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow-lg);
  backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4);
}
.dock button { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); transition: background .15s; }
.dock button:hover { background: var(--accent-soft); color: var(--ink); }
.dock button.active { color: var(--ink); background: var(--accent-soft); }
.dock .primary { width: 62px; height: 62px; margin: 0 6px; background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 20px rgba(19,38,79,.35); }
.dock .primary:hover { background: var(--accent); color: var(--on-accent); filter: brightness(1.12); }

/* ============ Shared bits ============ */
.round {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
  border: 1.5px solid var(--ink-3); color: var(--ink); background: transparent; transition: background .15s;
}
.round:hover { background: var(--accent-soft); }
.round.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 20px; border-radius: 999px;
  font-weight: 600; background: var(--accent); color: var(--on-accent); transition: filter .15s;
}
.btn:hover { filter: brightness(1.15); }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--ink-3); }
.btn.ghost:hover { background: var(--accent-soft); filter: none; }
.btn.danger { background: var(--danger); color: #fff; }
[data-theme="dark"] .btn.danger { color: #2a0705; }
.btn.small { height: 34px; padding: 0 14px; font-size: 14px; }
.dot { font-family: var(--font-dot); font-weight: 400; line-height: 1; letter-spacing: .02em; }

/* ============ Home ============ */
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.hero h1 {
  margin: 0; font-family: var(--font-display); font-weight: 200; letter-spacing: -.03em; line-height: 1;
  font-size: clamp(56px, 9vw, 120px); color: var(--ink);
}
.hero .sub { margin: 14px 0 0; color: var(--ink-2); font-size: 17px; }
.sortbox { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.sortbox select {
  height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card);
  backdrop-filter: blur(14px); cursor: pointer;
}
.sortbox select option { color: #10203f; background: #fff; }
.chips { display: flex; gap: 10px; flex-wrap: wrap; margin: 30px 0 26px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--card-border); color: var(--ink); font-weight: 500;
  backdrop-filter: blur(14px); transition: background .15s;
}
.chip:hover { background: var(--card-hover); }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip .badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 99px; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--on-accent); color: var(--accent); }
.chip .tg { opacity: .55; }

.banner {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 24px 0 0; padding: 12px 14px 12px 20px;
  border-radius: 999px; background: var(--card); border: 1px solid var(--card-border); backdrop-filter: blur(14px);
}
.banner p { margin: 0; flex: 1; min-width: 200px; }

.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); grid-auto-rows: minmax(158px, auto);
  grid-auto-flow: dense; gap: 18px;
}
.sec { margin-top: 38px; }
.sec:first-of-type { margin-top: 0; }
.sec-title {
  display: flex; align-items: center; gap: 12px; margin: 0 0 16px 6px; font-family: var(--font-display);
  font-weight: 300; font-size: 28px; letter-spacing: -.02em; color: var(--ink);
}
.sec-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.sec-n { order: 1; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 2px 10px; border-radius: 99px; background: var(--card); }
.sec-title::after { order: 2; }
.card {
  position: relative; display: flex; flex-direction: column; gap: 8px; min-height: 176px; padding: 22px; overflow: hidden;
  border-radius: var(--radius); background: var(--card); border: 1px solid var(--card-border); box-shadow: var(--shadow);
  backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3);
  cursor: pointer; transition: transform .2s ease, background .2s ease;
}
.card:hover { transform: translateY(-3px); background: var(--card-hover); }
.w2 { grid-column: span 2; } .h2 { grid-row: span 2; }
.c-title { margin: 0; font-family: var(--font-display); font-weight: 500; font-size: 21px; line-height: 1.2; letter-spacing: -.01em; padding-right: 30px; overflow-wrap: anywhere; }
.c-prev { margin: 0; color: var(--ink-2); font-size: 15px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.c-meta { margin-top: auto; padding-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--ink-3); align-items: center; }
.c-tag { padding: 1px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--ink-2); }
.pinbtn { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-3); opacity: 0; transition: opacity .15s; }
.card:hover .pinbtn, .pinbtn.on, .pinbtn:focus-visible { opacity: 1; }
.pinbtn.on { color: var(--ink); }
.pinbtn:hover { background: var(--accent-soft); }
.card.pin .c-title { font-family: var(--font-dot); font-weight: 600; font-size: 22px; letter-spacing: .02em; }
.card.pin .big { font-size: 72px; color: var(--ink); margin-bottom: 4px; }
.card.folder { justify-content: space-between; }
.card.folder .big { font-size: 78px; }
.card.folder .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.card.folder .fl-name { font-family: var(--font-dot); font-weight: 600; font-size: 20px; letter-spacing: .02em; overflow-wrap: anywhere; }
.card.folder .fl-sub { color: var(--ink-3); font-size: 14px; }
.card.folder .go { width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.card.img { color: #fff; border: 0; padding: 0; min-height: 340px; background: #5d73a6 center/cover no-repeat; }
.card.img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(8,16,40,.78), rgba(8,16,40,0) 62%); }
.card.img .over { position: absolute; left: 22px; right: 22px; bottom: 20px; z-index: 1; }
.card.img .c-title { font-family: var(--font-dot); font-weight: 700; font-size: 30px; padding: 0; }
.card.img .sub { font-size: 14px; opacity: .85; margin-top: 4px; }
.card.todo { cursor: default; }
.card.todo:hover { transform: none; }
.todo-head { display: flex; justify-content: space-between; align-items: flex-start; }
.todo-head .big { font-size: 64px; }
.todo-head span.t { font-family: var(--font-display); font-weight: 500; font-size: 21px; }
.pills { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
.pill {
  display: flex; align-items: center; gap: 10px; min-height: 42px; padding: 4px 16px 4px 5px; border-radius: 999px;
  border: 1.5px solid var(--line); background: rgba(255,255,255,.35); color: var(--ink); text-align: left; width: 100%;
}
[data-theme="dark"] .pill { background: rgba(255,255,255,.04); }
.pill:hover { border-color: var(--ink-3); }
.pill .ck { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--ink-3); display: grid; place-items: center; flex: none; }
.pill .txt { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
.pill .txt small.due { display: block; font-size: 12px; line-height: 1.2; opacity: .7; }
.pill .txt small.due.late { color: var(--danger); opacity: 1; font-weight: 600; }
.pill .txt { line-height: 1.25; }
.pill.done { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pill.done .ck { border-color: transparent; background: rgba(255,255,255,.18); }
[data-theme="dark"] .pill.done .ck { background: rgba(13,26,63,.12); }
.pill.done .txt { text-decoration: line-through; text-decoration-thickness: 1px; opacity: .9; }

.empty {
  max-width: 520px; margin: 50px auto; padding: 44px; border-radius: 36px; text-align: center;
  background: var(--card); border: 1px solid var(--card-border); backdrop-filter: blur(18px); box-shadow: var(--shadow);
}
.empty .big { font-size: 80px; }
.empty h2 { margin: 6px 0 8px; font-family: var(--font-display); font-weight: 300; font-size: 32px; letter-spacing: -.02em; }
.empty p { margin: 0 0 24px; color: var(--ink-2); }

/* ============ Note view ============ */
.note-view { max-width: 920px; margin: 0 auto; }
.note-top { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.note-top .meta { flex: 1; display: flex; align-items: center; gap: 14px; min-width: 200px; flex-wrap: wrap; }
.note-top .actions { display: flex; gap: 10px; }
.move { display: flex; align-items: center; gap: 8px; color: var(--ink-2); font-size: 14px; }
.move select { height: 38px; max-width: 240px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--card-border); background: var(--card); backdrop-filter: blur(14px); cursor: pointer; }
.move select option { color: #10203f; background: #fff; }
.status { font-size: 13px; color: var(--ink-2); transition: opacity .4s; }
.status.idle { opacity: .55; }
.status.err { color: var(--danger); opacity: 1; font-weight: 600; }
.sheet {

/* =====================================================================
   storage — the ONLY module that touches IndexedDB.
   To move to the cloud in v2, re-implement this same interface.
   ===================================================================== */
const storage = (() => {
  let db;
  const STORES = {
    folders: 'id', notes: 'id', tags: 'id', attachments: 'id', meta: 'key',
    note_tags: ['note_id', 'tag_id'], note_links: ['source_note_id', 'target_note_id'],
  };
  const open = () => new Promise((res, rej) => {
    const r = indexedDB.open('notes-app', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      for (const [name, key] of Object.entries(STORES)) {
        const s = d.createObjectStore(name, { keyPath: key });
        if (name === 'attachments' || name === 'note_tags') s.createIndex('note_id', 'note_id');
        if (name === 'note_links') { s.createIndex('source', 'source_note_id'); s.createIndex('target', 'target_note_id'); }
      }
    };
    r.onsuccess = () => { db = r.result; res(); };
    r.onerror = () => rej(r.error);
  });
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const txDone = t => new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  const all = s => req(db.transaction(s).objectStore(s).getAll());
  const get = (s, k) => req(db.transaction(s).objectStore(s).get(k));
  const write = (stores, fn) => { const t = db.transaction(stores, 'readwrite'); fn(t); return txDone(t); };
  const byIndex = (t, store, index, key) => req(t.objectStore(store).index(index).getAll(IDBKeyRange.only(key)));
  const blobToB64 = b => new Promise((res, rej) => { const f = new FileReader(); f.onload = () => res(String(f.result).split(',')[1] || ''); f.onerror = () => rej(f.error); f.readAsDataURL(b); });

  const api = {
    async init() {
      await open();
      let inboxId = (await get('meta', 'inbox_id'))?.value;
      const folders = await all('folders');
      if (!inboxId || !folders.find(f => f.id === inboxId)) {
        inboxId = folders.find(f => f.name === 'Inbox' && !f.parent_id)?.id || uuid();
        if (!folders.find(f => f.id === inboxId)) await api.saveFolder({ id: inboxId, name: 'Inbox', parent_id: null, created_at: now(), updated_at: now(), deleted_at: null });
        await api.setMeta('inbox_id', inboxId);
      }
      if (!(await api.getMeta('first_run_at'))) await api.setMeta('first_run_at', now());
      return inboxId;
    },
    async getMeta(key) { return (await get('meta', key))?.value; },
    setMeta(key, value) { return write('meta', t => t.objectStore('meta').put({ key, value })); },

    async loadAll() {
      const [notes, folders, tags, note_tags, note_links] = await Promise.all(['notes', 'folders', 'tags', 'note_tags', 'note_links'].map(all));
      return { notes, folders, tags, note_tags, note_links };
    },
    saveNote(note) { return write('notes', t => t.objectStore('notes').put(note)); },
    saveFolder(folder) { return write('folders', t => t.objectStore('folders').put(folder)); },
    async purgeFolder(id) { return write('folders', t => t.objectStore('folders').delete(id)); },
    async purgeNote(id) {
      const t = db.transaction(['notes', 'attachments', 'note_tags', 'note_links'], 'readwrite');
      const done = txDone(t);
      t.objectStore('notes').delete(id);
      for (const a of await byIndex(t, 'attachments', 'note_id', id)) t.objectStore('attachments').delete(a.id);
      for (const l of await byIndex(t, 'note_tags', 'note_id', id)) t.objectStore('note_tags').delete([l.note_id, l.tag_id]);
      for (const l of await byIndex(t, 'note_links', 'source', id)) t.objectStore('note_links').delete([l.source_note_id, l.target_note_id]);
      for (const l of await byIndex(t, 'note_links', 'target', id)) t.objectStore('note_links').delete([l.source_note_id, l.target_note_id]);
      await done;
      await api.cleanTags();
    },

    // Tags (note–tag links). Takes tag names; creates tag records as needed.
    async setNoteTags(noteId, names) {
      const tags = await all('tags');
      const ids = [];
      const created = [];
      for (const name of names) {
        let tag = tags.find(t => t.name.toLowerCase() === name.toLowerCase());
        if (!tag) { tag = { id: uuid(), name }; tags.push(tag); created.push(tag); }
        ids.push(tag.id);
      }
      const t = db.transaction(['tags', 'note_tags'], 'readwrite');
      const done = txDone(t);
      created.forEach(tag => t.objectStore('tags').put(tag));
      for (const l of await byIndex(t, 'note_tags', 'note_id', noteId)) t.objectStore('note_tags').delete([l.note_id, l.tag_id]);
      ids.forEach(tag_id => t.objectStore('note_tags').put({ note_id: noteId, tag_id }));
      await done;
      await api.cleanTags();
    },
    async cleanTags() {
      const [tags, links] = await Promise.all([all('tags'), all('note_tags')]);
      const used = new Set(links.map(l => l.tag_id));
      const orphans = tags.filter(t => !used.has(t.id));
      if (orphans.length) await write('tags', t => orphans.forEach(o => t.objectStore('tags').delete(o.id)));
    },
    // Links between notes (refreshed on save; used for backlinks).
    async setNoteLinks(sourceId, targetIds) {
      const t = db.transaction('note_links', 'readwrite');
      const done = txDone(t);
      for (const l of await byIndex(t, 'note_links', 'source', sourceId)) t.objectStore('note_links').delete([l.source_note_id, l.target_note_id]);
      targetIds.forEach(target_note_id => t.objectStore('note_links').put({ source_note_id: sourceId, target_note_id }));
      await done;
    },
    // Attachments (blobs)
    saveAttachment(att) { return write('attachments', t => t.objectStore('attachments').put(att)); },
    getAttachment(id) { return get('attachments', id); },

    // Backup — same shape as the tables, so it can be imported into a cloud DB later.
    async exportAll() {
      const [folders, notes, tags, note_tags, note_links, atts] = await Promise.all(['folders', 'notes', 'tags', 'note_tags', 'note_links', 'attachments'].map(all));
      const attachments = [];
      for (const a of atts) attachments.push({ id: a.id, note_id: a.note_id, filename: a.filename, mime_type: a.mime_type, created_at: a.created_at, data_base64: await blobToB64(a.blob) });
      return { format: 'notes-app-backup', version: 1, exported_at: now(), inbox_id: await api.getMeta('inbox_id'), folders, notes, tags, note_tags, note_links, attachments };
    },
    async importAll(data) {
      if (!data || data.format !== 'notes-app-backup') throw new Error('This file is not a notes backup.');
      const merge = async (store, items) => {
        const existing = new Map((await all(store)).map(x => [x.id, x]));
        const keep = items.filter(i => !existing.has(i.id) || (existing.get(i.id).updated_at || '') < (i.updated_at || ''));
        await write(store, t => keep.forEach(i => t.objectStore(store).put(i)));
        return keep.length;
      };
      const currentInbox = await api.getMeta('inbox_id');
      // Map the backup's Inbox onto this device's Inbox so there aren't two.
      const remap = data.inbox_id && data.inbox_id !== currentInbox;
      const folders = (data.folders || []).filter(f => !(remap && f.id === data.inbox_id));
      const notes = (data.notes || []).map(n => remap && n.folder_id === data.inbox_id ? { ...n, folder_id: currentInbox } : n);
      const fixedFolders = folders.map(f => remap && f.parent_id === data.inbox_id ? { ...f, parent_id: currentInbox } : f);
      let count = 0;
      count += await merge('folders', fixedFolders);
      count += await merge('notes', notes);
      const tags = await all('tags');
      const tagMap = new Map(tags.map(t => [t.name.toLowerCase(), t]));
      const idRemap = new Map();
      const newTags = [];
      for (const t of data.tags || []) {
        const ex = tagMap.get(t.name.toLowerCase());
        if (ex) idRemap.set(t.id, ex.id); else { newTags.push(t); tagMap.set(t.name.toLowerCase(), t); }
      }
      await write(['tags', 'note_tags', 'note_links'], t => {
        newTags.forEach(x => t.objectStore('tags').put(x));
        (data.note_tags || []).forEach(l => t.objectStore('note_tags').put({ note_id: l.note_id, tag_id: idRemap.get(l.tag_id) || l.tag_id }));
        (data.note_links || []).forEach(l => t.objectStore('note_links').put(l));
      });
      const atts = [];
      for (const a of data.attachments || []) {
        const blob = await (await fetch(`data:${a.mime_type || 'application/octet-stream'};base64,${a.data_base64}`)).blob();
        atts.push({ id: a.id, note_id: a.note_id, filename: a.filename, mime_type: a.mime_type, created_at: a.created_at, blob });
      }
      await write('attachments', t => atts.forEach(a => t.objectStore('attachments').put(a)));
      return count;
    },
  };
  return api;
})();

const TONES = [['', 'Default'], ['sky', 'Sky'], ['mint', 'Mint'], ['sage', 'Sage'], ['sand', 'Sand'], ['rose', 'Rose'], ['lilac', 'Lilac'], ['slate', 'Slate']];

/* ---- Text extraction from blocks ---- */
function flatList(items) { const out = []; (items || []).forEach(i => { if (typeof i === 'string') out.push(i); else { out.push(i.content || i.text || ''); out.push(...flatList(i.items)); } }); return out; }
function blocksToText(data) {
  const out = [];
  for (const b of data?.blocks || []) {
    const d = b.data || {};
    switch (b.type) {
      case 'paragraph': case 'header': case 'callout': out.push(strip(d.text)); break;
      case 'list': flatList(d.items).forEach(t => out.push(strip(t))); break;
      case 'checklist': (d.items || []).forEach(i => out.push(strip(i.text))); break;
      case 'code': out.push(d.code || ''); break;
      case 'table': (d.content || []).forEach(r => out.push(r.map(strip).join(' '))); break;
      case 'image': out.push(d.caption || ''); break;
      case 'file': out.push(d.filename || ''); break;
      case 'reminder': out.push(d.text || ''); break;
    }
  }
  return out.filter(Boolean).join('\n');
}
function blocksToMarkdown(note) {
  const lines = [`# ${note.title || 'Untitled'}`, ''];
  const md = h => strip(String(h ?? '').replace(/<b>(.*?)<\/b>/g, '**$1**').replace(/<i>(.*?)<\/i>/g, '*$1*'));
  for (const b of note.blocks?.blocks || []) {
    const d = b.data || {};
    if (b.type === 'header') lines.push('#'.repeat(Math.min(6, (d.level || 1) + 1)) + ' ' + md(d.text), '');
    else if (b.type === 'paragraph') lines.push(md(d.text), '');
    else if (b.type === 'list') { flatList(d.items).forEach((t, i) => lines.push((d.style === 'ordered' ? `${i + 1}. ` : '- ') + md(t))); lines.push(''); }
    else if (b.type === 'checklist') { (d.items || []).forEach(i => lines.push(`- [${i.checked ? 'x' : ' '}] ${md(i.text)}`)); lines.push(''); }
    else if (b.type === 'code') lines.push('```' + (d.lang === 'plaintext' ? '' : d.lang || ''), d.code || '', '```', '');
    else if (b.type === 'callout') lines.push('> ' + md(d.text).replace(/\n/g, '\n> '), '');
    else if (b.type === 'table') { (d.content || []).forEach((r, i) => { lines.push('| ' + r.map(md).join(' | ') + ' |'); if (i === 0) lines.push('|' + r.map(() => ' --- ').join('|') + '|'); }); lines.push(''); }
    else if (b.type === 'image') lines.push(`*[Image${d.caption ? ': ' + d.caption : ''}]*`, '');
    else if (b.type === 'reminder') lines.push(`- [${d.done ? 'x' : ' '}] Reminder: ${d.text || ''}${d.due ? ' (' + d.due.replace('T', ' ') + ')' : ''}`, '');
    else if (b.type === 'file') lines.push(`*[File: ${d.filename || ''}]*`, '');
  }
  return lines.join('\n');
}
const extractLinks = data => [...new Set([...JSON.stringify(data || {}).matchAll(/#\/note\/([0-9a-f-]{36})/g)].map(m => m[1]))];

/* =====================================================================
   Search (simple in-memory index)
   ===================================================================== */
function rebuildIndex() {
  S.index = liveNotes().map(n => {
    const tags = tagsOf(n.id);
    return { n, title: n.title || 'Untitled', text: n.plain_text || '', tags, hay: ((n.title || '') + ' ' + (n.plain_text || '') + ' ' + tags.join(' ')).toLowerCase() };
  });
}
function hilite(text, terms) {
  let out = esc(text);
  terms.filter(Boolean).forEach(t => { out = out.replace(new RegExp('(' + esc(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>'); });
  return out;
}
function runSearch(q) {
  const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
  if (!terms.length) return [];
  return S.index.filter(e => terms.every(t => e.hay.includes(t)))
    .map(e => {
      const tl = e.title.toLowerCase();
      const score = terms.reduce((s, t) => s + (tl.includes(t) ? 10 : 0) + (e.tags.some(x => x.toLowerCase().includes(t)) ? 4 : 0), 0);
      return { e, score };
    })
    .sort((a, b) => b.score - a.score || b.e.n.updated_at.localeCompare(a.e.n.updated_at)).slice(0, 30)
    .map(({ e }) => {
      const low = e.text.toLowerCase();
      const pos = Math.min(...terms.map(t => low.indexOf(t)).filter(i => i >= 0).concat([Infinity]));
      let snip = '';
      if (isFinite(pos)) { const s = Math.max(0, pos - 50); snip = (s ? '…' : '') + e.text.slice(s, s + 150).replace(/\s+/g, ' ') + (s + 150 < e.text.length ? '…' : ''); }
      else snip = e.text.slice(0, 120).replace(/\s+/g, ' ');
      return { e, snip, terms };
    });
}

const Popup = {
  el: $('#popup'), items: [], sel: 0, onPick: null, kind: null,
  show(kind, items, rect, onPick) {
    if (!items.length) return this.hide();
    const changed = this.kind !== kind;
    this.kind = kind; this.items = items; this.onPick = onPick;
    if (changed || this.sel >= items.length) this.sel = 0;
    this.el.innerHTML = items.map((it, i) => `<button type="button" data-i="${i}" class="${i === this.sel ? 'sel' : ''}"><span class="pi">${it.icon || icon('file', 16)}</span><span style="min-width:0"><span>${esc(it.label)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ''}</span></button>`).join('');
    this.el.hidden = false;
    const h = this.el.offsetHeight, w = this.el.offsetWidth;
    let top = rect.bottom + 8, left = rect.left;
    if (top + h > innerHeight - 10) top = Math.max(10, rect.top - h - 8);
    if (left + w > innerWidth - 10) left = innerWidth - w - 10;
    this.el.style.top = top + 'px'; this.el.style.left = Math.max(10, left) + 'px';
    this.el.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  },
  hide() { this.el.hidden = true; this.kind = null; },
  get open() { return !this.el.hidden; },
  pick(i) { const it = this.items[i]; const cb = this.onPick; this.hide(); if (it && cb) cb(it); },
  key(e) {
    if (!this.open) return false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      this.sel = (this.sel + (e.key === 'ArrowDown' ? 1 : -1) + this.items.length) % this.items.length;
      $$('button', this.el).forEach((b, i) => b.classList.toggle('sel', i === this.sel));
      this.el.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' || e.key === 'Tab') this.pick(this.sel);
    else if (e.key === 'Escape') this.hide();
    else return false;
    e.preventDefault(); e.stopImmediatePropagation();
    return true;
  },
};
Popup.el.addEventListener('mousedown', e => { e.preventDefault(); const b = e.target.closest('[data-i]'); if (b) Popup.pick(+b.dataset.i); });

function replaceCurrentBlock(type, data) {
  const idx = S.editor.blocks.getCurrentBlockIndex();

function onEditorInput() {
  if (!S.editor) return;
  const sel = getSelection();

      const items = liveNotes().filter(n => n.id !== S.cur?.id && (n.title || 'Untitled').toLowerCase().includes(q))

  // "/" slash menu
  const sm = t.match(/^\/([\w ]*)$/);

  if (a === 'note') return { name: 'note', id: v };
  if (a === 'folder') return { name: 'home', filter: { type: 'folder', id: v } };
  if (a === 'tag') return { name: 'home', filter: { type: 'tag', id: v } };
  if (a === 'trash') return { name: 'trash' };

}

  document.body.classList.remove('drawer');

  if (S.route.name !== 'note') S.lastList = location.hash || '#/';
  renderSidebar();
  const r = S.route;
  $('#dock-home').classList.toggle('active', r.name === 'home' && r.filter.type === 'all');
  if (r.name === 'note') await renderNote(r.id);
  else if (r.name === 'trash') renderTrash();
  else renderHome();
  scrollTo(0, 0);
}

function todoItems() {
  const items = [];
  for (const n of liveNotes()) (n.blocks?.blocks || []).forEach((b, bi) => { if (b.type === 'checklist') (b.data.items || []).forEach((it, ii) => { if (strip(it.text).trim()) items.push({ n, bi, ii, text: strip(it.text), checked: !!it.checked }); }); });
  return items.sort((a, b) => b.n.updated_at.localeCompare(a.n.updated_at));
}
function todoCardHtml() {
  const items = todoItems(); if (!items.length) return '';
  const open = items.filter(i => !i.checked), done = items.filter(i => i.checked);
  const show = open.slice(0, 5); if (show.length < 5) show.push(...done.slice(0, 5 - show.length));

async function renderBackupBanner() {

/* ---- Reminders: fire while the app is open ---- */
function askNotifyPermission() { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
function checkReminders() {
  let fired; try { fired = new Set(JSON.parse(lsGet('notes.fired', '[]'))); } catch (e) { fired = new Set(); }
  let changed = false;
  for (const n of liveNotes()) (n.blocks?.blocks || []).forEach((b, i) => {
    if (b.type !== 'reminder' || b.data.done || !b.data.due) return;
    const key = n.id + ':' + i + ':' + b.data.due;
    const at = new Date(b.data.due).getTime();
    if (fired.has(key) || isNaN(at) || at > Date.now()) return;
    fired.add(key); changed = true;
    const text = b.data.text || 'Reminder';
    try { if ('Notification' in window && Notification.permission === 'granted') { const x = new Notification(text, { body: n.title || 'Untitled' }); x.onclick = () => { focus(); go('#/note/' + n.id); }; } } catch (e) {}
    toast('Reminder: ' + text, { label: 'Open note', fn: () => go('#/note/' + n.id) });
  });
  if (changed) lsSet('notes.fired', JSON.stringify([...fired].slice(-300)));
}
setInterval(checkReminders, 20000);

    <div class="sec-head" data-act="expandSidebar">${icon('folder', 20)}<span class="grow">Folders</span><button class="sec-add" data-act="newFolder" data-id="" aria-label="New folder" title="New folder">${icon('plus', 16)}</button></div>
    <div class="sec-list">${tree(null, 0) || '<div class="empty-hint">No folders yet. Add one with +.</div>'}</div>
    <div class="sec-head" data-act="expandSidebar">${icon('tag', 20)}<span class="grow">Tags</span></div>
    <div class="sec-list">${tags.map(([t, c]) => `<div class="frow ${r.name === 'home' && r.filter.type === 'tag' && r.filter.id.toLowerCase() === t.toLowerCase() ? 'active' : ''}" data-act="filterTag" data-id="${esc(t)}"><span class="chev-sp"></span><span class="fname">#${esc(t)}</span><span class="fcount">${c}</span></div>`).join('') || '<div class="empty-hint">Tags you add to notes appear here.</div>'}</div>
    <button class="sb-item ${r.name === 'trash' ? 'active' : ''}" data-act="trash" style="margin-top:8px" title="Trash">${icon('trash', 20)}<span class="grow">Trash</span><span class="sb-count">${S.notes.filter(n => n.deleted_at).length + S.folders.filter(f => f.deleted_at && f.id !== S.inboxId).length || ''}</span></button>`;
}

/* =====================================================================
   Actions
   ===================================================================== */
async function newNote(folderId) {
  const f = S.route.filter;
  const folder = folderId || (S.route.name === 'home' && f.type === 'folder' ? f.id : S.inboxId);
  const n = { id: uuid(), folder_id: folder, title: '', blocks: { blocks: [] }, plain_text: '', pinned: false, created_at: now(), updated_at: now(), deleted_at: null };
  await leaveNote();
  await storage.saveNote(n);
  S.notes.push(n);
  go('#/note/' + n.id);
}
async function togglePin(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return;
  n.pinned = !n.pinned; await touchNote(n);
  if (S.route.name === 'note') { const b = $('[data-act="pinCur"]'); if (b) { b.classList.toggle('on', n.pinned); b.title = n.pinned ? 'Unpin' : 'Pin to top'; } renderSidebar(); }
  else { renderSidebar(); renderHome(); }
}
async function trashNote(id) {
  const n = S.notes.find(x => x.id === id); if (!n) return;
  if (S.cur === n) await flush();
  n.deleted_at = now(); n.updated_at = now(); await storage.saveNote(n); rebuildIndex();
  toast('Moved to Trash', { label: 'Undo', fn: () => restoreNote(n.id, true) });
  go('#/');
}
async function restoreNote(id, quiet) {
  const n = S.notes.find(x => x.id === id); if (!n) return;
  n.deleted_at = null; n.updated_at = now();
  const f = S.folders.find(x => x.id === n.folder_id);
  if (!f || f.deleted_at) n.folder_id = S.inboxId;
  await storage.saveNote(n); rebuildIndex();
  if (!quiet) toast('Restored');
  if (S.route.name === 'note') { await leaveNote(); await renderNote(id); } else if (S.route.name === 'trash') renderTrash(); else renderHome();
  renderSidebar();
}
async function moveNote(id, folderId) {
  const n = S.notes.find(x => x.id === id); if (!n || folderOf(n) === folderId) return;
  n.folder_id = folderId; await touchNote(n);
  toast('Moved to ' + (S.folders.find(f => f.id === folderId)?.name || 'Inbox'));
  renderSidebar(); if (S.route.name === 'home') renderHome(); applyTone();
}
async function folderDialog(folder, parentId) {
  const exclude = folder ? folderIds(folder.id) : new Set();
  const d = dialog(`<h2>${folder ? 'Edit folder' : 'New folder'}</h2>
    <label class="field">Name<input id="fname" value="${esc(folder?.name || '')}" maxlength="80" placeholder="e.g. Data Science" autocomplete="off"></label>
    <label class="field">Inside<select id="fparent"><option value="">Top level</option>${folderOptions(exclude, folder ? folder.parent_id : parentId)}</select></label>
    <div class="field" id="tonefield">Note color<div class="swatches" role="radiogroup" aria-label="Note color">${TONES.map(([v, l]) => `<button type="button" class="sw" data-tone="${v}" role="radio" aria-checked="${(folder?.color || '') === v}" aria-label="${l}" title="${l}"></button>`).join('')}</div></div>
    <div class="modal-actions"><button class="btn ghost" data-v="0">Cancel</button><button class="btn" data-v="1">${folder ? 'Save folder' : 'Create folder'}</button></div>`);
  const input = $('#fname', d); input.focus(); input.select();
  let color = folder?.color || '';
  $('#tonefield', d).addEventListener('click', e => {
    const b = e.target.closest('.sw'); if (!b) return;
    color = b.dataset.tone;
    $$('.sw', d).forEach(x => x.setAttribute('aria-checked', x === b));
  });
  const submit = async () => {
    const name = input.value.trim(); if (!name) { input.focus(); return; }
    const parent = $('#fparent', d).value || null;
    if (folder) { folder.name = name; folder.parent_id = parent; folder.color = color; folder.updated_at = now(); await storage.saveFolder(folder); }
    else { const f = { id: uuid(), name, parent_id: parent, color, created_at: now(), updated_at: now(), deleted_at: null }; await storage.saveFolder(f); S.folders.push(f); if (parent) S.expanded.add(parent); lsSet('notes.expanded', JSON.stringify([...S.expanded])); }
    d.close(); S.sidebarOpen = true; lsSet('notes.sidebar', '1'); renderSidebar(); if (S.route.name === 'home') renderHome();
    if (S.route.name === 'note') { $('[data-change="move"]').innerHTML = folderOptions(new Set(), folderOf(S.cur), true); applyTone(); }
  };
  d.addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) b.dataset.v === '1' ? submit() : d.close(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
}
async function deleteFolder(id) {
  const f = S.folders.find(x => x.id === id); if (!f || id === S.inboxId) return;
  const ids = folderIds(id);
  const affected = liveNotes().filter(n => ids.has(folderOf(n))).length;
  if (!await confirmDialog(`Delete "${f.name}"?`, `The folder${ids.size > 1 ? ' and its subfolders go' : ' goes'} to the Trash. ${affected ? `Its ${affected} ${affected === 1 ? 'note moves' : 'notes move'} to ${f.parent_id ? 'the parent folder' : 'your Inbox'}.` : ''}`, 'Delete folder', true)) return;
  const target = f.parent_id || S.inboxId, ts = now();
  for (const n of liveNotes().filter(n => ids.has(folderOf(n)))) { n.folder_id = target; n.updated_at = ts; await storage.saveNote(n); }
  for (const x of S.folders.filter(x => ids.has(x.id))) { x.deleted_at = ts; x.updated_at = ts; await storage.saveFolder(x); }
  if ((S.route.name === 'home' && S.route.filter.type === 'folder' && ids.has(S.route.filter.id))) go('#/'); else { renderSidebar(); if (S.route.name === 'home') renderHome(); }
  toast('Folder moved to Trash');
}
async function exportBackup() {
  const data = await storage.exportAll();
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `notes-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  await storage.setMeta('last_export_at', now());
  toast('Backup saved to your downloads'); $('#banner-slot') && ($('#banner-slot').innerHTML = '');
}
async function importBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    const n = await storage.importAll(data);
    await refresh(); await route();
    toast(`Imported backup — ${n} ${n === 1 ? 'item' : 'items'} added or updated`);
  } catch (e) { console.error(e); toast(e.message || 'Could not read that backup file.'); }
}
function openSettings() {
  const mode = lsGet('notes.theme', 'auto');
  const d = dialog(`<h2>Settings</h2>
    <h3>Appearance</h3>
    <div class="seg" role="group" aria-label="Theme">${[['auto', 'System'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-act="theme" data-v="${v}" class="${mode === v ? 'on' : ''}">${l}</button>`).join('')}</div>
    <h3>Backup</h3>
    <p class="muted">Notes are stored only in this browser. Clearing site data would erase them, so export a backup now and then. Importing merges a backup into your notes and keeps the newer version of anything that exists in both.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="export">${icon('download', 18)} Export backup</button><button class="btn ghost" data-act="importPick">${icon('upload', 18)} Import backup</button><input type="file" id="importfile" accept=".json,application/json" hidden></div>
    <p class="muted" id="lastbackup" style="margin-top:14px"></p>
    <h3>Shortcuts</h3>
    <p class="muted"><span class="kbd">Ctrl</span> <span class="kbd">K</span> search · <span class="kbd">Alt</span> <span class="kbd">N</span> new note (also <span class="kbd">Ctrl</span> <span class="kbd">N</span> where the browser allows) · <span class="kbd">/</span> block menu · <span class="kbd">[[</span> link a note</p>
    <div class="modal-actions"><button class="btn" data-v="0">Done</button></div>`);
  d.addEventListener('click', e => { if (e.target.closest('[data-v]')) d.close(); });
  $('#importfile', d).addEventListener('change', e => { const f = e.target.files[0]; if (f) { d.close(); importBackup(f); } });
  storage.getMeta('last_export_at').then(v => { const el = $('#lastbackup', d); if (el) el.textContent = v ? `Last backup: ${new Date(v).toLocaleString()}` : 'You haven\'t exported a backup yet.'; });
}
function applyTheme(mode) {
  lsSet('notes.theme', mode);
  const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (lsGet('notes.theme', 'auto') === 'auto') applyTheme('auto'); });

/* ---- Search overlay ---- */
function openSearch() {
  if ($('dialog.search')) return;
  const d = dialog(`<div class="search-in">${icon('search', 22)}<input id="q" placeholder="Search titles, content and tags" autocomplete="off" aria-label="Search notes"></div><div class="results" id="results"></div>`, 'search');
  const q = $('#q', d), box = $('#results', d);
  let results = [], sel = 0;
  const paint = () => {
    if (!q.value.trim()) { box.innerHTML = `<div class="res-empty">Type to search across all your notes.</div>`; return; }
    if (!results.length) { box.innerHTML = `<div class="res-empty">No notes match "${esc(q.value)}". Try fewer or different words.</div>`; return; }
    box.innerHTML = results.map((r, i) => `<button class="res ${i === sel ? 'sel' : ''}" data-i="${i}"><div class="rt">${hilite(r.e.title, r.terms)}</div>${r.snip ? `<div class="rs">${hilite(r.snip, r.terms)}</div>` : ''}<div class="rm">${esc(folderPath(folderOf(r.e.n)))}${r.e.tags.length ? ' · ' + r.e.tags.map(t => '#' + esc(t)).join(' ') : ''}</div></button>`).join('');
    box.querySelector('.sel')?.scrollIntoView({ block: 'nearest' });
  };
  const choose = i => { const r = results[i]; if (r) { d.close(); go('#/note/' + r.e.n.id); } };
  q.addEventListener('input', () => { results = runSearch(q.value); sel = 0; paint(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (results.length) { sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + results.length) % results.length; paint(); } }
    else if (e.key === 'Enter') { e.preventDefault(); choose(sel); }
  });
  box.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) choose(+b.dataset.i); });
  paint(); q.focus();
}

/* =====================================================================
   Global event wiring
   ===================================================================== */
const actions = {
  home: () => go('#/'), goAll: () => go('#/'), back: () => go(S.lastList || '#/'),
  search: openSearch, new: () => newNote(), settings: openSettings,
  open: el => go('#/note/' + el.dataset.id),
  openFolder: el => go('#/folder/' + el.dataset.id),
  filterTag: el => go('#/tag/' + encodeURIComponent(el.dataset.id)),
  trash: () => go('#/trash'),
  pin: el => togglePin(el.dataset.id), pinCur: () => togglePin(S.cur.id),
  trashCur: () => trashNote(S.cur.id),
  restoreNote: el => restoreNote(el.dataset.id),
  purgeNote: async el => { if (await confirmDialog('Delete forever?', 'This note and its attachments will be removed permanently. This can\'t be undone.', 'Delete forever', true)) { await storage.purgeNote(el.dataset.id); S.notes = S.notes.filter(n => n.id !== el.dataset.id); renderTrash(); renderSidebar(); } },
  restoreFolder: async el => { const f = S.folders.find(x => x.id === el.dataset.id); const p = S.folders.find(x => x.id === f.parent_id); f.deleted_at = null; if (!p || p.deleted_at) f.parent_id = null; f.updated_at = now(); await storage.saveFolder(f); toast('Folder restored'); renderTrash(); renderSidebar(); },
  purgeFolder: async el => { if (await confirmDialog('Delete folder forever?', 'The folder will be removed permanently.', 'Delete forever', true)) { await storage.purgeFolder(el.dataset.id); S.folders = S.folders.filter(f => f.id !== el.dataset.id); renderTrash(); renderSidebar(); } },
  emptyTrash: async () => {
    if (!await confirmDialog('Empty the Trash?', 'Everything in the Trash will be removed permanently. This can\'t be undone.', 'Empty trash', true)) return;
    for (const n of S.notes.filter(n => n.deleted_at)) await storage.purgeNote(n.id);
    for (const f of S.folders.filter(f => f.deleted_at && f.id !== S.inboxId)) await storage.purgeFolder(f.id);
    S.notes = S.notes.filter(n => !n.deleted_at); S.folders = S.folders.filter(f => !f.deleted_at || f.id === S.inboxId);
    renderTrash(); renderSidebar(); toast('Trash emptied');
  },
  menu: () => document.body.classList.toggle('drawer'),
  closeDrawer: () => document.body.classList.remove('drawer'),
  toggleSidebar: () => { if (isMobile()) { document.body.classList.remove('drawer'); return; } S.sidebarOpen = !S.sidebarOpen; lsSet('notes.sidebar', S.sidebarOpen ? '1' : '0'); renderSidebar(); },
  expandSidebar: () => { if (!S.sidebarOpen) { S.sidebarOpen = true; lsSet('notes.sidebar', '1'); renderSidebar(); } },
  toggleFolder: el => { const id = el.dataset.id; S.expanded.has(id) ? S.expanded.delete(id) : S.expanded.add(id); lsSet('notes.expanded', JSON.stringify([...S.expanded])); renderSidebar(); },
  newFolder: el => folderDialog(null, el.dataset.id || null),
  editFolder: el => folderDialog(S.folders.find(f => f.id === el.dataset.id)),
  deleteFolder: el => deleteFolder(el.dataset.id),
  removeTag: el => setNoteTags(tagsOf(S.cur.id).filter(t => t !== el.dataset.tag)),
  toggleTodo: async el => {
    const n = S.notes.find(x => x.id === el.dataset.id), it = n?.blocks?.blocks?.[+el.dataset.b]?.data?.items?.[+el.dataset.i]; if (!it) return;
    it.checked = !it.checked; await touchNote(n); renderHome();
  },
  toggleReminder: async el => {
    const n = S.notes.find(x => x.id === el.dataset.id), d = n?.blocks?.blocks?.[+el.dataset.b]?.data; if (!d) return;
    d.done = !d.done; await touchNote(n); renderHome();
  },
  exportNote: () => {
    const n = S.cur; const blob = new Blob([blocksToMarkdown(n)], { type: 'text/markdown' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (n.title || 'Untitled').replace(/[\\/:*?"<>|]/g, '-') + '.md'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  },
  export: exportBackup, importPick: () => $('#importfile')?.click(),
  snooze: async () => { await storage.setMeta('backup_snooze_until', new Date(Date.now() + 864e5).toISOString()); $('#banner-slot').innerHTML = ''; },
  theme: el => { applyTheme(el.dataset.v); $$('[data-act="theme"]').forEach(b => b.classList.toggle('on', b === el)); },
};
document.addEventListener('click', e => {
  const link = e.target.closest('#editor a[href^="#/note/"]');
  if (link) { e.preventDefault(); go(link.getAttribute('href')); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  e.stopPropagation();
  actions[el.dataset.act]?.(el, e);
}, true);
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if (!el) return;
  if (el.dataset.change === 'sort') { S.sort = el.value; lsSet('notes.sort', S.sort); renderHome(); }
  if (el.dataset.change === 'move' && S.cur) { moveNote(S.cur.id, el.value); }
});
document.addEventListener('keydown', e => {
  if (Popup.key(e)) return;
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.key.toLowerCase() === 'k') { e.preventDefault(); e.stopImmediatePropagation(); openSearch(); }
  else if ((mod && !e.shiftKey && e.key.toLowerCase() === 'n') || (e.altKey && e.key.toLowerCase() === 'n')) { e.preventDefault(); newNote(); }
  else if (e.key === 'Enter' && e.target.matches?.('.card[data-act]')) { e.preventDefault(); actions[e.target.dataset.act]?.(e.target); }
}, true);
document.addEventListener('input', e => { if (e.target.closest?.('#editor') || e.target.closest?.('.ce-paragraph')) onEditorInput(); }, true);
document.addEventListener('mousedown', e => { if (Popup.open && !e.target.closest('#popup')) Popup.hide(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && dirty) flush(); });
addEventListener('pagehide', () => { if (dirty) flush(); });
addEventListener('hashchange', route);

// Phone: hide the action bar while the keyboard is up, and re-render the sidebar when the layout switches.
const phoneMq = matchMedia('(max-width: 760px)');
phoneMq.addEventListener('change', () => { document.body.classList.remove('drawer', 'typing'); renderSidebar(); });
document.addEventListener('focusin', e => { if (isMobile() && e.target.matches?.('input, textarea, [contenteditable="true"]') && !e.target.closest('dialog')) document.body.classList.add('typing'); });
document.addEventListener('focusout', () => setTimeout(() => { if (!document.activeElement?.matches?.('input, textarea, [contenteditable="true"]')) document.body.classList.remove('typing'); }, 60));

// Paste screenshots / images straight into the note.
document.addEventListener('paste', async e => {
  if (S.route.name !== 'note' || !S.editor || !e.target.closest?.('#editor')) return;
  const file = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  if (!file) return;
  e.preventDefault();
  const att = await addAttachment(file);
  const idx = S.editor.blocks.getCurrentBlockIndex();
  const cur = S.editor.blocks.getBlockByIndex(idx);
  const empty = cur && cur.name === 'paragraph' && !strip(cur.holder.textContent).trim();
  S.editor.blocks.insert('image', { attachment_id: att.id, filename: att.filename, caption: '' }, {}, empty ? idx : idx + 1, true, empty);
}, true);

// Drag a note card onto a folder in the sidebar (or a folder card) to move it.
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest?.('.card.note, .card.pin'); if (c) { dragId = c.dataset.id; e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } });
document.addEventListener('dragend', () => { dragId = null; $$('.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('dragover', e => { const t = e.target.closest?.('[data-drop]'); if (t && dragId) { e.preventDefault(); $$('.drop').forEach(x => x !== t && x.classList.remove('drop')); t.classList.add('drop'); } });
document.addEventListener('drop', e => { const t = e.target.closest?.('[data-drop]'); if (t && dragId) { e.preventDefault(); t.classList.remove('drop'); moveNote(dragId, t.dataset.drop); dragId = null; } });

/* =====================================================================
   Boot
   ===================================================================== */
(async function boot() {
  $('[data-act="menu"]').innerHTML = icon('menu', 22);
  $('#dock-home').innerHTML = icon('home', 22);
  $('[data-act="search"]').innerHTML = icon('search', 22);
  $('[data-act="new"]').innerHTML = icon('plus', 28);
  $('[data-act="settings"]').innerHTML = icon('settings', 22);
  try {
    S.inboxId = await Promise.race([storage.init(), new Promise((_, rej) => setTimeout(() => rej(new Error('Opening the database timed out.')), 6000))]);
    await refresh();
  } catch (e) {
    console.error(e);
    $('#main').innerHTML = `<div class="empty"><h2>Can't open the notes database</h2><p>Your browser blocked local storage for this page. Open the file in a normal (non-private) Chrome or Edge window and reload.</p></div>`;
    return;
  }
  await route();
  checkReminders();
})();
</script>
</body>
</html>
